{% extends "base.html" %}

{% block contenido %}

<div class="tarjeta grande">
    <h2>Administración de usuarios</h2>

    <a class="boton-secundario" href="{{ url_for('registro') }}">
        Agregar usuario
    </a>

    <table>
        <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>

        {% for usuario in usuarios %}
        <tr>
            <td>{{ usuario.id }}</td>
            <td>{{ usuario.nombre }}</td>
            <td>{{ usuario.correo }}</td>
            <td>
                <a href="{{ url_for('editar', id=usuario.id) }}">
                    Editar
                </a>

                <form method="POST"
                      action="{{ url_for('eliminar', id=usuario.id) }}"
                      onsubmit="return confirm('¿Deseas eliminar este usuario?');">
                    <button type="submit" class="eliminar">
                        Eliminar
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>

    <a href="{{ url_for('bienvenida') }}">Regresar</a>
</div>

{% endblock %}
